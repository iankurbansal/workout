<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Visual Home Program</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .day-card { display: none; animation: fadeIn 0.4s ease-out; }
        .day-card.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { background-color: #0f172a; color: white; border-color: #0f172a; }
        svg { width: 100%; max-width: 140px; margin: 0 auto; display: block; }
    </style>
</head>
<body class="pb-20">
    <header class="bg-slate-900 text-white p-6 shadow-md border-b-4 border-amber-500">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold tracking-tight">Dynamic Tension Protocol</h1>
            <p class="text-slate-400 mt-2 text-sm font-medium">Upgraded Vector Mannequin Edition</p>
            <div class="mt-6 bg-slate-800 p-4 rounded-lg border border-slate-700 text-sm">
                <strong class="text-amber-500">Dietary Target:</strong> Aim for 110g-120g of protein daily to reverse the "skinny fat" baseline and add mass. Mixing an unflavoured whey isolate into a smoothie with dates is a high-efficiency way to hit this without artificial sweeteners.
            </div>
        </div>
    </header>

    <div class="sticky top-0 bg-white/90 backdrop-blur border-b border-slate-200 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex p-4 gap-3 overflow-x-auto" id="nav-container"></div>
    </div>

    <main class="max-w-4xl mx-auto p-4 mt-6" id="content-area"></main>

    <script>
        // Geometry Engine to build the SVGs dynamically
        function buildSvg(head, S, H, K, F, E, A, equipType, bkK = null, bkF = null) {
            let svg = '<svg viewBox="0 0 100 100"><line x1="10" y1="85" x2="90" y2="85" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>';
            if (bkK && bkF) {
                svg += `<line x1="${H[0]}" y1="${H[1]}" x2="${bkK[0]}" y2="${bkK[1]}" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>`;
                svg += `<line x1="${bkK[0]}" y1="${bkK[1]}" x2="${bkF[0]}" y2="${bkF[1]}" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>`;
            }
            svg += `<line x1="${H[0]}" y1="${H[1]}" x2="${K[0]}" y2="${K[1]}" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>`;
            svg += `<line x1="${K[0]}" y1="${K[1]}" x2="${F[0]}" y2="${F[1]}" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>`;
            svg += `<line x1="${S[0]}" y1="${S[1]}" x2="${H[0]}" y2="${H[1]}" stroke="#475569" stroke-width="18" stroke-linecap="round"/>`;
            svg += `<circle cx="${head[0]}" cy="${head[1]}" r="8" fill="#475569"/>`;
            svg += `<line x1="${S[0]}" y1="${S[1]}" x2="${E[0]}" y2="${E[1]}" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>`;
            svg += `<line x1="${E[0]}" y1="${E[1]}" x2="${A[0]}" y2="${A[1]}" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>`;
            
            if (equipType === "pushup") svg += `<rect x="${A[0]-5}" y="${A[1]-2}" width="10" height="4" fill="#f59e0b" rx="2"/>`;
            if (equipType === "db") svg += `<line x1="${A[0]-6}" y1="${A[1]}" x2="${A[0]+6}" y2="${A[1]}" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>`;
            if (equipType === "db_fly") svg += `<line x1="${A[0]}" y1="${A[1]-6}" x2="${A[0]}" y2="${A[1]+6}" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>`;
            if (equipType === "band_row") svg += `<line x1="${A[0]}" y1="${A[1]}" x2="85" y2="85" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>`;
            if (equipType === "band_pallof") svg += `<line x1="${A[0]}" y1="${A[1]}" x2="90" y2="${A[1]}" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>`;
            if (equipType === "band_ohp" || equipType === "band_tri") svg += `<line x1="${A[0]}" y1="${A[1]}" x2="50" y2="85" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>`;
            if (equipType === "kb") {
                svg += `<circle cx="${A[0]}" cy="${A[1]+5}" r="6" fill="#f59e0b"/>`;
                svg += `<path d="M ${A[0]-4} ${A[1]+5} Q ${A[0]} ${A[1]-2} ${A[0]+4} ${A[1]+5}" stroke="#f59e0b" stroke-width="2" fill="none"/>`;
            }
            return svg + '</svg>';
        }

        // Frame Coordinates (Head, Shoulder, Hip, Knee, Foot, Elbow, Hand)
        const f_push1 = buildSvg([25,60], [35,65], [60,70], [75,75], [90,80], [35,75], [35,85], "pushup");
        const f_push2 = buildSvg([25,75], [35,80], [60,82], [75,83], [90,85], [25,75], [35,85], "pushup");

        const f_row1 = buildSvg([50,35], [50,45], [50,75], [70,75], [85,85], [50,60], [75,65], "band_row");
        const f_row2 = buildSvg([45,35], [45,45], [50,75], [70,75], [85,85], [35,60], [50,65], "band_row");

        const f_split1 = buildSvg([50,20], [50,30], [50,55], [55,70], [55,85], [50,45], [50,60], "db", [35,65], [25,70]);
        const f_split2 = buildSvg([50,45], [50,55], [50,75], [55,85], [55,85], [50,70], [50,85], "db", [35,85], [25,70]);

        const f_rdl1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [50,45], [50,60], "db");
        const f_rdl2 = buildSvg([30,45], [35,50], [55,55], [50,70], [50,85], [35,65], [35,75], "db");

        const f_lat1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [50,45], [50,60], "db");
        const f_lat2 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [35,35], [20,40], "db");

        const f_pal1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [40,40], [50,45], "band_pallof");
        const f_pal2 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [30,40], [25,40], "band_pallof");

        const f_ohp1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [40,40], [50,30], "band_ohp");
        const f_ohp2 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [50,15], [50,10], "band_ohp");

        const f_gob1 = buildSvg([50,20], [50,30], [50,55], [55,70], [55,85], [50,45], [55,40], "kb");
        const f_gob2 = buildSvg([50,45], [50,55], [50,75], [55,85], [55,85], [50,65], [55,60], "kb");

        const f_curl1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [50,45], [50,60], "db");
        const f_curl2 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [45,45], [55,35], "db");

        const f_fly1 = buildSvg([20,75], [20,80], [80,80], [80,80], [80,80], [35,80], [50,50], "db_fly");
        const f_fly2 = buildSvg([20,75], [20,80], [80,80], [80,80], [80,80], [35,80], [70,70], "db_fly");

        const f_tri1 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [65,20], [55,15], "band_tri");
        const f_tri2 = buildSvg([50,20], [50,30], [50,55], [50,70], [50,85], [65,20], [65,5], "band_tri");

        // Workout Database with Injury Warnings
        const workouts = [
            {
                id: "day1", title: "Day 1: Full Body (Push / Pull / Squat)",
                exercises: [
                    { set: "A1", name: "Deficit Push-Ups", reps: "3 x 8-12", tempo: "3s down, 1s pause", desc: "Lower slowly until chest passes the handles for a deep stretch.", mistake: "Flaring elbows out to 90 degrees (causes shoulder impingement) or letting the lower back sag.", frames: [f_push1, f_push2, f_push1], labels: ["Setup", "Stretch", "Explode Up"] },
                    { set: "A2", name: "Band Seated Rows", reps: "3 x 12-15", tempo: "1s squeeze, 3s release", desc: "Loop band around feet. Pull to ribs, squeezing shoulder blades hard.", mistake: "Rounding the lower back to reach forward, which compresses spinal discs.", frames: [f_row1, f_row2, f_row1], labels: ["Reach", "Squeeze", "Return"] },
                    { set: "B1", name: "DB Bulgarian Split Squats", reps: "3 x 8-12 / Leg", tempo: "3s down, explosive up", desc: "Rest back foot on a chair. Squat down slowly until back knee hovers.", mistake: "Letting the front knee cave inward during the push, placing sheer stress on knee ligaments.", frames: [f_split1, f_split2, f_split1], labels: ["Balance", "Squat", "Drive"] },
                    { set: "B2", name: "KB + Band Deadlifts", reps: "3 x 10-15", tempo: "3s down, 1s stretch", desc: "Hinge hips back with a straight spine until hamstrings stretch.", mistake: "Rounding the lower back. The spine must remain perfectly straight to avoid herniated discs.", frames: [f_rdl1, f_rdl2, f_rdl1], labels: ["Stance", "Hinge", "Glutes"] },
                    { set: "C1", name: "DB Lateral Raises", reps: "2 x 12-15", tempo: "1s top pause, 2s down", desc: "Control the descent to maximize tension on the lateral deltoids.", mistake: "Swinging the torso to lift the weight, which strains the lumbar spine.", frames: [f_lat1, f_lat2, f_lat1], labels: ["Down", "Raise", "Lower"] },
                    { set: "C2", name: "Band Pallof Press", reps: "2 x 10 / Side", tempo: "3s static hold", desc: "Stand sideways, press band straight out from chest, resisting the twist.", mistake: "Allowing the lower back to twist. The core must stay entirely rigid to protect the spine.", frames: [f_pal1, f_pal2, f_pal1], labels: ["Chest", "Press", "Return"] }
                ]
            },
            {
                id: "day2", title: "Day 2: Full Body (Hinge / Overhead / Core)",
                exercises: [
                    { set: "A1", name: "Band Overhead Press", reps: "3 x 10-12", tempo: "Explosive up, 3s down", desc: "Step on band, press overhead. The resistance increases at the top.", mistake: "Arching the lower back excessively to push the weight up, compressing the lumbar spine.", frames: [f_ohp1, f_ohp2, f_ohp1], labels: ["Rack", "Press", "Lower"] },
                    { set: "A2", name: "DB + Band RDLs", reps: "3 x 10-15", tempo: "3s down, feel stretch", desc: "Push hips backward, keeping shins vertical. Squeeze glutes to stand.", mistake: "Rounding the lower back. Keep the chest proud to protect the spinal discs.", frames: [f_rdl1, f_rdl2, f_rdl1], labels: ["Tension", "Hinge", "Stand"] },
                    { set: "B1", name: "Push-Up Handle Planks", reps: "3 x 45s Hold", tempo: "Isometric", desc: "Hold the top push-up position. Actively squeeze core, glutes, and chest.", mistake: "Letting the hips droop toward the floor, causing deep lower back strain.", frames: [f_push1, f_push1, f_push1], labels: ["Position", "Hold", "Breathe"] },
                    { set: "B2", name: "Single Arm DB Row", reps: "3 x 10-12 / Arm", tempo: "2s pause at top", desc: "Pull the DB up to your hip, contracting the back muscles heavily.", mistake: "Twisting the spine to jerk the weight up instead of keeping the torso squared to the floor.", frames: [f_row1, f_row2, f_row1], labels: ["Stretch", "Pull", "Lower"] },
                    { set: "C1", name: "KB Goblet Squats", reps: "2 x 12-15", tempo: "4s down, 2s pause", desc: "Hold KB at chest. The long pause at the bottom eliminates momentum.", mistake: "Letting heels lift off the ground, forcing damaging sheer stress into the knee joints.", frames: [f_gob1, f_gob2, f_gob1], labels: ["Hold", "Deep Pause", "Stand"] },
                    { set: "C2", name: "Dumbbell Bicep Curls", reps: "2 x 10-12", tempo: "3s slow descent", desc: "Keep elbows pinned. Squeeze biceps hard at the top and lower with control.", mistake: "Leaning back and swinging the weight, placing pressure on the lower spine.", frames: [f_curl1, f_curl2, f_curl1], labels: ["Straight", "Squeeze", "Lower"] }
                ]
            },
            {
                id: "day3", title: "Day 3: Full Body (Volume Focus)",
                exercises: [
                    { set: "A1", name: "1.5 Rep Push-Ups", reps: "3 x 6-10", tempo: "Continuous tension", desc: "Go all the way down, come halfway up, go back down, then all the way up.", mistake: "Flaring elbows to the sides or letting the hips sag toward the floor.", frames: [f_push1, f_push2, f_push1], labels: ["Start", "Halfway", "Extend"] },
                    { set: "A2", name: "Band Face Pulls", reps: "3 x 15", tempo: "2s hold at face", desc: "Pull hands towards your face, separating the band to target rear shoulders.", mistake: "Arching the lower back to help pull the band. Keep the ribs pulled down.", frames: [f_row1, f_row2, f_row1], labels: ["Extended", "Pull", "Release"] },
                    { set: "B1", name: "DB Reverse Lunges", reps: "3 x 10 / Leg", tempo: "3s slow descent", desc: "Step backward, gently touching the back knee to the floor, then drive up.", mistake: "Slamming the back knee into the floor (patella impact) or letting the front knee cave inward.", frames: [f_split1, f_split2, f_split1], labels: ["Stand", "Step Back", "Return"] },
                    { set: "B2", name: "Floor Dumbbell Flyes", reps: "3 x 10-12", tempo: "3s down, 1s stretch", desc: "Lie on back. Lower DBs out to the side until triceps touch the floor.", mistake: "Dropping the weights too fast and bouncing elbows off the floor, which can tear the chest muscle.", frames: [f_fly1, f_fly2, f_fly1], labels: ["Arms Up", "Stretch", "Squeeze"] },
                    { set: "C1", name: "Band Tricep Extensions", reps: "2 x 12-15", tempo: "2s slow descent", desc: "Anchor band low, pull up behind head, and extend arms straight up.", mistake: "Pushing the head/neck forward forcefully to make room for the band, causing cervical neck strain.", frames: [f_tri1, f_tri2, f_tri1], labels: ["Behind Head", "Extend", "Lower"] },
                    { set: "C2", name: "DB Hammer Curls", reps: "2 x 12-15", tempo: "2s slow descent", desc: "Keep palms facing each other (neutral grip) to target the brachialis.", mistake: "Using the lower back to swing the weights up instead of locking the torso in place.", frames: [f_curl1, f_curl2, f_curl1], labels: ["Neutral", "Curl", "Lower"] }
                ]
            }
        ];

        // Rendering Logic
        const navContainer = document.getElementById('nav-container');
        const contentArea = document.getElementById('content-area');

        workouts.forEach((day, index) => {
            const btn = document.createElement('button');
            btn.className = `nav-btn px-6 py-2 rounded-full border border-slate-300 font-semibold whitespace-nowrap transition-colors hover:bg-slate-100 text-sm ${index === 0 ? 'active' : ''}`;
            btn.innerText = day.title.split(':')[0];
            btn.onclick = () => showDay(day.id, btn);
            navContainer.appendChild(btn);

            let html = `<div id="${day.id}" class="day-card ${index === 0 ? 'active' : ''} mb-12">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 pb-2 inline-block border-b-4 border-amber-500">${day.title}</h2>
                <div class="space-y-6">`;
            
            day.exercises.forEach(ex => {
                html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                    <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="flex items-center gap-3">
                            <span class="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-lg text-sm">${ex.set}</span>
                            <h3 class="font-bold text-xl text-slate-800">${ex.name}</h3>
                        </div>
                        <div class="text-left sm:text-right w-full sm:w-auto flex flex-row sm:flex-col justify-between items-center sm:items-end">
                            <div class="font-bold text-slate-700 text-lg">${ex.reps}</div>
                            <div class="text-xs font-semibold text-slate-600 bg-slate-200 px-2 py-1 rounded-md mt-0 sm:mt-1">⏱️ ${ex.tempo}</div>
                        </div>
                    </div>
                    <div class="p-5 grid grid-cols-3 gap-2 sm:gap-6 relative">
                        <div class="absolute inset-y-0 left-1/3 w-px bg-slate-100 hidden sm:block"></div>
                        <div class="absolute inset-y-0 left-2/3 w-px bg-slate-100 hidden sm:block"></div>
                        ${ex.frames.map((frame, i) => `
                        <div class="text-center relative">
                            ${i > 0 ? '<div class="absolute top-1/2 -left-3 sm:-left-5 w-6 h-6 sm:w-8 sm:h-8 -mt-3 sm:-mt-4 bg-white border border-slate-200 rounded-full flex items-center justify-center text-slate-400 text-xs shadow-sm z-10 hidden sm:flex">➔</div>' : ''}
                            <div class="bg-white rounded-xl">${frame}</div>
                            <div class="mt-3 text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider">${ex.labels[i]}</div>
                        </div>
                        `).join('')}
                    </div>
                    <div class="px-5 py-4 text-slate-600 text-[15px] border-t border-slate-100 bg-slate-50/50">
                        <div class="mb-2"><strong class="text-slate-800">💡 Form Cue:</strong> ${ex.desc}</div>
                        <div class="text-red-700"><strong class="text-red-700">⚠️ Injury Risk:</strong> ${ex.mistake}</div>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
            contentArea.innerHTML += html;
        });

        function showDay(dayId, activeBtn) {
            document.querySelectorAll('.day-card').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(dayId).classList.add('active');
            activeBtn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
